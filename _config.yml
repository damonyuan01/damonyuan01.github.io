###########################################################
### Beautiful Jekyll configuration
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Xiaolei (Damon) Yuan

# Your name to show in the footer
author: Xiaolei Yuan

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  About: "aboutme"
  Research: "research"
  Publications: "publications"
  Projects: "projects"
  Team: "team"
  CV: "cv"

################
# --- Logo --- #
################

# Image to show in the navigation bar
avatar: "/assets/img/avatar-icon.png"

# Show avatar as a circle
round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "xiaolei.yuan@lut.fi"
  github: damonyuan01
  google-scholar: "902sSrMAAAAJ"

# RSS feed description
rss-description: Academic website of Xiaolei Yuan

###########################
# --- General options --- #
###########################

# Social share buttons
share-links-active:
  twitter: false
  facebook: false
  linkedin: true
  vk: false
  reddit: false

# Website URL shown in footer
url-pretty: "damonyuan01.github.io"

# Add website title to page titles
title-on-all-pages: true

# Excerpt word length
excerpt_length: 50

# Show excerpts in blog feed
feed_show_excerpt: true

# Show tags below posts
feed_show_tags: true

# Search button in navbar
post_search: true

# GitHub edit button in footer
edit_page_button: true

# Allow longer submenu entries
navbar-var-length: false

# SEO keywords
keywords: "Xiaolei Yuan, Damon Yuan, LUT University, Building Energy Systems, HVAC, Data Centre Cooling, Data Center Cooling, Waste Heat Recovery, Energy Systems, AI Infrastructure, Sustainable Buildings"

######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

#################################
# --- Web Analytics Section --- #
#################################

# Add Google Analytics later if needed
#gtag: "G-XXXXXXXXXX"

####################
# --- Comments --- #
####################

# Comments disabled for now

################
# --- Misc --- #
################

# Date format
date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here --- #
#################################################################################

timezone: "Europe/Helsinki"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
